name: OBS Not Kontrol

on:
  schedule:
    # Saatte bir (ucretsiz 2000 dk/ay kotasini doldurmaz, suresiz calisir).
    # Daha sik istersen bu satiri degistir (orn. "*/30 * * * *"), AMA hemen bir
    # kontrol icin commit'e gerek yok: Actions > "Run workflow" ile aninda calisir.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (giris + not okuma + Telegram'i dogrular, durumu degistirmez)"
        type: boolean
        default: false

# Ayni anda birden fazla kosu olmasin (durum dosyasi cakismasin).
concurrency:
  group: obs-check
  cancel-in-progress: false

permissions:
  contents: write   # last_grades.json'u repoya geri yazabilmek icin.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Tesseract kur
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Playwright tarayici onbellegi
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Bagimliliklar
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Calistir
        env:
          OBS_STUDENT_NO: ${{ secrets.OBS_STUDENT_NO }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Izlenecek donem. Ileri Bilgisayar Aglari (but bekleniyor) 2025-2026
          # Bahar = 20252 doneminde. GitHub'da OBS_DONEM degiskeni tanimlanirsa
          # o kullanilir; yoksa 20252 varsayilir. Yeni donemde bu degeri guncelle.
          OBS_DONEM: ${{ vars.OBS_DONEM || '20252' }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python -m src.main --test
          else
            python -m src.main --once
          fi

      - name: Durumu sakla
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name "obs-bot"
          git config user.email "obs-bot@users.noreply.github.com"
          git add -f data/last_grades.json || true
          git commit -m "durum guncelleme [skip ci]" || echo "degisiklik yok"
          git push || echo "push atlandi"
